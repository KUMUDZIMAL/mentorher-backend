name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (web + worker share this image)
        run: docker build -t mentorher-backend:ci .

  docker-publish:
    # Manual only — pushes to Docker Hub when (and only when) secrets exist.
    if: github.event_name == 'workflow_dispatch'
    needs: [verify, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub secrets
        id: check
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub secrets not set — skipping publish"
          fi
      - name: Docker Hub login
        if: steps.check.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        if: steps.check.outputs.ok == 'true'
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/mentorher-backend:latest" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/mentorher-backend:${{ github.sha }}" .
          docker push --all-tags "${{ secrets.DOCKERHUB_USERNAME }}/mentorher-backend"
